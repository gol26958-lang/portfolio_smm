<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMM Specialist Portfolio</title>
  <!-- Tailwind CSS для стильного темного дизайна -->
  <script src="https://tailwindcss.com"></script>
  <!-- Виджет авторизации в админке -->
  </script>
</head>
<body class="bg-[#0d0d0d] text-white font-sans antialiased selection:bg-zinc-800">

  <!-- Навигация -->
  <nav class="flex justify-between items-center p-6 max-w-7xl mx-auto border-b border-zinc-800">
    <div class="text-xl font-bold tracking-wider">SMM.PRO</div>
    <div class="space-x-6 text-sm text-zinc-400">
      <a href="#cases" class="hover:text-white transition">Кейсы</a>
      <a href="#services" class="hover:text-white transition">Услуги</a>
    </div>
  </nav>

  <!-- Главный экран (Hero) -->
  <section class="max-w-4xl mx-auto text-center py-20 px-4">
    <h1 id="hero-title" class="text-4xl md:text-6xl font-extrabold tracking-tight mb-6 leading-tight">
      <!-- Загрузится из админки -->
    </h1>
    <p id="hero-subtitle" class="text-zinc-400 text-lg md:text-xl max-w-2xl mx-auto mb-10">
      <!-- Загрузится из админки -->
    </p>
    <div class="flex justify-center gap-4">
      <a href="#cases" class="bg-white text-black px-6 py-3 rounded-full font-medium hover:bg-zinc-200 transition">Смотреть кейсы</a>
      <a id="tg-btn" href="#" target="_blank" class="border border-zinc-700 px-6 py-3 rounded-full font-medium hover:bg-zinc-900 transition">Обсудить проект</a>
    </div>
  </section>

  <!-- Блок Кейсов -->
  <section id="cases" class="max-w-7xl mx-auto px-6 py-20 border-t border-zinc-900">
    <h2 class="text-2xl font-bold mb-10 text-zinc-500 tracking-wider">ВЫПОЛНЕННЫЕ КЕЙСЫ</h2>
    <div id="cases-container" class="grid md:grid-cols-2 gap-8">
      <!-- Сюда админка будет автоматически добавлять карточки проектов -->
    </div>
  </section>

  <!-- Блок Услуг -->
  <section id="services" class="max-w-7xl mx-auto px-6 py-20 border-t border-zinc-800">
    <h2 class="text-2xl font-bold mb-10 text-zinc-500 tracking-wider">УСЛУГИ</h2>
    <div id="services-container" class="grid md:grid-cols-3 gap-6">
      <!-- Сюда админка будет автоматически добавлять ваши услуги -->
    </div>
  </section>

  <!-- Подвал сайта -->
  <footer class="border-t border-zinc-800 bg-[#090909] py-16 text-center">
    <h2 class="text-3xl font-bold mb-6">Есть проект? Давайте обсудим.</h2>
    <a id="tg-footer-btn" href="#" target="_blank" class="inline-block bg-white text-black px-8 py-4 rounded-full font-semibold hover:bg-zinc-200 transition">
      Написать в Telegram →
    </a>
  </footer>

  <!-- Скрипты -->
  <script src="/js/app.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => { document.location.href = "/admin/"; });
        }
      });
    }
  </script>
</body>
</html>

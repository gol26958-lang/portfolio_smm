<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMM Specialist Portfolio</title>
  <!-- Виджет авторизации в админке -->
  </script>
  
  <!-- Автономные встроенные стили: дизайн откроется идеально в любых условиях -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0d0d0d; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; padding-bottom: 60px; }
    nav { display: flex; justify-content: space-between; align-items: center; padding: 24px; max-width: 1200px; margin: 0 auto; border-b: 1px solid #27272a; }
    .logo { font-size: 20px; font-weight: bold; letter-spacing: 0.05em; }
    .nav-links a { color: #a1a1aa; text-decoration: none; font-size: 14px; margin-left: 24px; transition: color 0.2s; }
    .nav-links a:hover { color: #ffffff; }
    .hero { max-width: 800px; margin: 0 auto; text-align: center; padding: 100px 16px; }
    .hero h1 { font-size: 46px; font-weight: 800; line-height: 1.2; margin-bottom: 24px; }
    .hero p { color: #a1a1aa; font-size: 18px; max-width: 600px; margin: 0 auto 40px auto; line-height: 1.5; }
    .btn-group { display: flex; justify-content: center; gap: 16px; }
    .btn-primary { background-color: #ffffff; color: #000000; padding: 12px 28px; border-radius: 9999px; font-weight: 500; text-decoration: none; transition: background 0.2s; }
    .btn-primary:hover { background-color: #e4e4e7; }
    .btn-secondary { border: 1px solid #3f3f46; color: #ffffff; padding: 12px 28px; border-radius: 9999px; font-weight: 500; text-decoration: none; transition: background 0.2s; }
    .btn-secondary:hover { background-color: #18181b; }
    .section { max-width: 1200px; margin: 0 auto; padding: 80px 24px; }
    .section-title { font-size: 22px; font-weight: bold; margin-bottom: 40px; color: #71717a; letter-spacing: 0.05em; }
    .grid-2 { display: grid; grid-template-columns: 1fr; gap: 32px; }
    .grid-3 { display: grid; grid-template-columns: 1fr; gap: 24px; }
    @media (min-width: 768px) { .grid-2 { grid-template-columns: 1fr 1fr; } .grid-3 { grid-template-columns: 1fr 1fr 1fr; } }
    .card { background-color: #18181b; border-radius: 16px; border: 1px solid #27272a; padding: 32px; transition: transform 0.2s; }
    .card:hover { transform: translateY(-2px); }
    .card span { font-size: 11px; color: #71717a; font-weight: bold; text-transform: uppercase; letter-spacing: 0.05em; }
    .card h3 { font-size: 22px; font-weight: bold; margin: 8px 0 16px 0; }
    .card p { color: #a1a1aa; font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
    .card-link { font-size: 14px; font-weight: 600; color: #e4e4e7; text-decoration: none; }
    .service-card { border: 1px solid #27272a; padding: 32px; border-radius: 16px; background-color: #090909; }
    .service-card h3 { font-size: 20px; font-weight: bold; margin-bottom: 12px; }
    .service-card p { color: #a1a1aa; font-size: 14px; line-height: 1.5; }
    footer { border-top: 1px solid #27272a; background-color: #090909; padding: 80px 16px; text-align: center; }
    footer h2 { font-size: 32px; font-weight: bold; margin-bottom: 24px; }
    .btn-footer { display: inline-block; background-color: #ffffff; color: #000000; padding: 16px 36px; border-radius: 9999px; font-weight: 600; text-decoration: none; transition: background 0.2s; }
    .btn-footer:hover { background-color: #e4e4e7; }
  </style>
</head>
<body>

  <!-- Навигация -->
  <nav>
    <div class="logo">SMM.PRO</div>
    <div class="nav-links">
      <a href="#cases">Кейсы</a>
      <a href="#services">Услуги</a>
    </div>
  </nav>

  <!-- Главный экран -->
  <section class="hero">
    <h1 id="hero-title">Соцсети, которые работают на бизнес</h1>
    <p id="hero-subtitle">Создаю контент и продающие стратегии для брендов, которым нужны внимание аудитории, новые заявки и продажи.</p>
    <div class="btn-group">
      <a href="#cases" class="btn-primary">Смотреть кейсы</a>
      <a id="tg-btn" href="#" target="_blank" class="btn-secondary">Обсудить проект</a>
    </div>
  </section>

  <!-- Блок Кейсов -->
  <section id="cases" class="section">
    <h2 class="section-title">ВЫПОЛНЕННЫЕ КЕЙСЫ</h2>
    <div id="cases-container" class="grid-2">
      <!-- Сюда админка будет автоматически добавлять ваши карточки проектов -->
    </div>
  </section>

  <!-- Блок Услуг -->
  <section id="services" class="section" style="border-top: 1px solid #27272a;">
    <h2 class="section-title">УСЛУГИ</h2>
    <div id="services-container" class="grid-3">
      <!-- Сюда админка будет автоматически добавлять ваши услуги -->
    </div>
  </section>

  <!-- Подвал сайта -->
  <footer>
    <h2>Есть проект? Давайте обсудим.</h2>
    <a id="tg-footer-btn" href="#" target="_blank" class="btn-footer">
      Написать в Telegram →
    </a>
  </footer>

  <!-- Скрипты подключения к вашей базе данных на GitHub -->
  <script src="/js/app.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => { document.location.href = "/admin/"; });
        }
      });
    }
  </script>
</body>
</html>
